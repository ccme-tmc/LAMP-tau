# Example input for the relaxation analysis (mag_anal).
# System: DyAC. The data are in this inpfile/ directory.
# Run from examples/relaxation:
#   lamp-tau --yml inpfile/CFPs_v1.yml
# or
#   python -m mag_anal.Anal_Tau --yml inpfile/CFPs_v1.yml

CFPs_filename: inpfile/CFPs_py.out
mag_filename: inpfile/eqpyout
Ab_Type: 3                      # 0 Molcas, 1 OpenMolcas, 3 PySCF
freq_filename: inpfile/freq.log
POSCAR: inpfile/POSCAR
Atom_list: inpfile/Atom_list
TO_foldname: inpfile/TTO

# Outputs
VP_filename: TPs_file/VP.log
TPs_foldname: TPs
Out_foldname: TPs_file

# Frequency correction and CFP fitting
Correction_slope: 1
Corrected_intercept: 0
Fitting_order: 1
CFPs_X: [-0.1, -0.08, -0.06, -0.04, -0.02, 0, 0.02, 0.04, 0.06, 0.08, 0.1]
CFPs_Type: 1                    # 1 = Cartesian (xyz) displacement CFPs

# Spin-phonon perturbation
If_Perb: True
Perb_T: 0.01
g_z: 19.8
Linewidth_parameter: 10         # cm^-1

# Temperature grid
If_T_step: True
nTrange: 1
Trange1: 10,50,5

# Plotting and relaxation channels
If_get_picture_Tt: True
If_Orbach: True
If_Raman: False                 # set True to include the Raman channel (slower)
If_uniformization: False

# Experimental data overlay (disabled for the shipped example)
If_Data: False
